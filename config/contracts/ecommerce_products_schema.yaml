dataset_name: "ecommerce_product_catalog"
version: "1.0"
description: "Data Contract for Amazon & retail product inventory feeds"
schema:
  required_columns:
    - product_id
    - title
    - price
    - stock_count
    - category
rules:
  null_check:
    required_non_null:
      - product_id
      - title
      - price
  type_check:
    numeric_columns:
      - price
      - stock_count
  duplicate_check:
    unique_key: "product_id"
  row_count_bounds:
    min_rows: 1
    max_rows: 100000
